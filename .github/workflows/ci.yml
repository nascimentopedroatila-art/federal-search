name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v --junitxml=junit.xml
      - name: Emit failure annotation from junit
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          tree = ET.parse('junit.xml')
          for tc in tree.iter('testcase'):
              for kind in ('failure', 'error'):
                  el = tc.find(kind)
                  if el is not None:
                      msg = (el.get('message') or '')[:600].replace('%', '%25').replace('\r', ' ').replace('\n', ' | ')
                      print(f"::error::FAILED {tc.get('classname')}::{tc.get('name')} - {msg}")
          EOF

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  syntax:
    name: Syntax check (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile all sources
        run: |
          python -m compileall -q nexus.py core cli plugins database reports tests
      - name: Smoke test CLI
        run: |
          python nexus.py --version
          python nexus.py plugins
          python nexus.py selfcheck

  build:
    name: Build check (package)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-dist
          path: dist/
